# Concord Nova server — the USB stick's boot menu (the Ubuntu Server 24.04 one,
# relabelled). The installer reads /autoinstall.yaml from the stick and asks
# "Continue with autoinstall?" before it erases anything.
set timeout=10

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install the Concord Nova server (Ubuntu Server 24.04)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  ---
	initrd	/casper/initrd
}
menuentry "Install the Concord Nova server - newest hardware (HWE kernel)" {
	set gfxpayload=keep
	linux	/casper/hwe-vmlinuz  ---
	initrd	/casper/hwe-initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
fi
